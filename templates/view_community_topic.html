{% extends "layout.html" %}

{% block main %}


<h2>{{ topic_name }}</h2>
<div class="dropdown">
        <button class="import" onclick="toggleDropdown()">Import</button>
        <div class="dropdown-subjects" id="dropdownSubjects">
            {% for subject in user_subjects %}
                <a href="#" onclick="var f = document.getElementById('importTopicForm'); f.action = this.dataset.action; f.submit(); return false;"
                   data-action="{{ url_for('community.import_topic', topic_id=topic_id, topic_name=topic_name, subject_id=subject[0] ) }}">{{ subject[1] }}</a>
            {% endfor %}
        </div>
        <form id="importTopicForm" method="post" hidden>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        </form>
</div>


<ul class="flashcard-list">
    {% for flashcard in flashcards %}
        <li class="flashcard-front">
            {{ flashcard[1] }}
        </li>
        <ul class="flashcard-back">
            <li class="flashcard-back"> {{ flashcard[2] }}</li>
        </ul>
    {% endfor %}
</ul>

{% endblock %}
