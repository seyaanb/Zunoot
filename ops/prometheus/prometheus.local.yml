# Local Prometheus for `docker compose --profile observability up`.
# Production metrics are scraped by Grafana Cloud instead (SETUP_CHECKLIST.md).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: zunoot
    # Same bearer-token auth Grafana Cloud uses against production.
    authorization:
      credentials: local-metrics-token
    static_configs:
      - targets: ["web:10000"]
